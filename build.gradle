plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id "org.openapi.generator" version "7.8.0"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

apply plugin: 'org.openapi.generator'

openApiValidate {
    inputSpec.set("$rootDir/spec.yaml")
}

openApiGenerate {
    generatorName = "spring"
    version = "1.0.0"
    inputSpec = "$rootDir/spec.yaml".toString()
    outputDir = "$buildDir/generated".toString()
    apiPackage = "org.openapi.example.api"
    invokerPackage = "org.openapi.example.invoker"
    configOptions = [
        dateLibrary: "java8",
        interfaceOnly: "true",
    ]
}

sourceSets {
    main {
        java.srcDir 'build/generated/src/main/java'
    }
}

compileJava {
    source += sourceSets.main.java
}

tasks.named("compileJava").configure { dependsOn("openApiGenerate") }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'org.openapitools:jackson-databind-nullable:0.2.6'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'junit:junit'
    testImplementation 'com.h2database:h2:1.3.148'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "io.swagger.core.v3:swagger-annotations-jakarta:2.2.7"
    implementation 'javax.validation:validation-api:2.0.1.Final'
    compileOnly 'javax.servlet:javax.servlet-api:3.0.1'
}

tasks.named('test') {
    useJUnitPlatform()
}